[package]
name = "anomaly_detector"
version = "0.1.0"
edition = "2021"

[lib]
name = "anomaly_detector"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "GO"
path = "src/parse_use.rs"
